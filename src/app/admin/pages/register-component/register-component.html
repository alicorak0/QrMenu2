<div class="login">
    <img src="/adminloginbackground.jpg.jpeg" alt="login image" class="login__img">

    <form [formGroup]="registerForm" action="" class="login__form">
        <h1 class="login__title">Register</h1>

        <div class="login__content">

            <div class="login__box">
                <i class="ri-user-3-line login__icon"></i>
                <div class="login__box-input">
                    <input formControlName="firstName" type="text" required class="login__input" id="login-firstName"
                        placeholder=" ">
                    <label for="login-firstName" class="login__label">First Name</label>
                </div>
            </div>


            <div class="login__box">
                <i class="ri-user-3-line login__icon"></i>
                <div class="login__box-input">
                    <input formControlName="lastName" type="text" required class="login__input" id="login-lastName"
                        placeholder=" ">
                    <label for="login-lastName" class="login__label">Last Name</label>
                </div>
            </div>
            <div class="login__box">
                <i class="ri-user-3-line login__icon"></i>
                <div class="login__box-input">
                    <input type="email" formControlName="email" type="email" required class="login__input"
                        id="login-email" placeholder=" ">
                    <label for="login-email" class="login__label">Email</label>
                </div>
            </div>

            <div class="login__box">
                <i class="ri-lock-2-line login__icon"></i>

                <div class="login__box-input">
                    <input type="password" formControlName="password" required class="login__input" id="login-pass"
                        placeholder=" ">
                    <label for="login-pass" class="login__label">Password</label>
                    <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                </div>
            </div>
        </div>



        <button type="submit" (click)="register()" class="login__button">Register</button>

        <!-- <p class="login__register">
                  Don't have an account? <a href="#">Register</a>
               </p> -->
    </form>
</div>
